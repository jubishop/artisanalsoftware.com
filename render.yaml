services:
  - type: web
    name: artisanalsoftware
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /health
    autoDeploy: true
    domains:
      - artisanalsoftware.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://artisanalsoftware.com
