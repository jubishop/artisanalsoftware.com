name: Repository checks

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The NVR's runner, or GitHub's whenever the NVR can't run the job: home-infra's CI router sets the CI_TIER
    # repository variable to github then, and a job reads it as it queues. Unset, or anything else, CI runs on the NVR.
    # See jubishop/home-infra's memory/nvr-ci-runners.md#hosted-fallback. local, the primary Mac's Colima VM, stays
    # unmapped until its job image has the libatomic1 that Node 26 loads (#4).
    runs-on: ${{ fromJSON(vars.CI_TIER == 'github' && '"ubuntu-latest"' || '["self-hosted","nvr"]') }}
    # On the NVR's runner, a job waits up to 30 minutes for one of its four CI slots, and the wait counts here.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Both runners have ShellCheck, curl, and jq, the NVR's from home-infra's nvr/apt-packages.txt, and the NVR's has
      # no sudo. A tool one lacks gets an install step that runs only when it is missing, and an entry in that list.
      - name: Verify ShellCheck
        run: shellcheck --version
      # setup-node's lts/* can lag nodejs.org when a new major turns LTS; see
      # docs/foundation/engineering-policy.md#runtime-and-toolchain-versions.
      - name: Find the newest Node LTS on nodejs.org
        id: node
        shell: bash
        run: |
          version=$(curl -fsSL --retry 3 https://nodejs.org/dist/index.json |
            jq -er '[.[] | select(.lts) | .version | ltrimstr("v")] | max_by(split(".") | map(tonumber))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Check repository
        run: bin/check --full
